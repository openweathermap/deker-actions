name: build

on:
  workflow_call:

jobs:
  build:
    name: Build the source distribution and the wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from the git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build
        run: uv build

      - name: Save the distributions
        uses: actions/upload-artifact@v7
        with:
          name: artifact  # the callers download it by this name into dist/
          path: dist/*
