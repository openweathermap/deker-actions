name: checks

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python to run the checks and the tests on
        required: true
        type: string
      siblings:
        description: JSON list of the sibling repositories that tool.uv.sources points to; they are cloned next to the project
        type: string
        default: "[]"
      numpy-version:
        description: The lowest NumPy supported on this Python; when set, the project is resolved anew with it instead of the lock and only the tests run
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  checks:
    name: Python ${{ inputs.python-version }}${{ inputs.numpy-version != '' && format(', NumPy {0}', inputs.numpy-version) || '' }}
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ inputs.python-version }}${{ inputs.numpy-version != '' && format('-numpy-{0}', inputs.numpy-version) || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from the git tags

      - name: Clone the sibling repositories
        if: inputs.siblings != '[]'
        run: |
          for repo in $(echo '${{ inputs.siblings }}' | jq -r '.[]'); do
            echo "Cloning $repo"
            git clone --quiet --branch "$GITHUB_REF_NAME" "https://github.com/openweathermap/$repo" "../$repo" 2>/dev/null \
              || git clone --quiet "https://github.com/openweathermap/$repo" "../$repo"
            echo "  $(git -C "../$repo" branch --show-current)"
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install the project
        if: inputs.numpy-version == ''
        run: uv sync --all-groups --locked

      - name: Install the project with NumPy ${{ inputs.numpy-version }}
        if: inputs.numpy-version != ''
        # not from the lock: it holds the newest NumPy and packages that need it (pandas 3); the other packages resolve
        # to the newest versions that work with this NumPy, as they do for a user who has it. tool.uv.sources are honoured
        run: |
          uv venv --python ${{ inputs.python-version }}
          uv pip install --editable . --group dev "numpy==${{ inputs.numpy-version }}"
          uv run --no-sync python -c "import importlib.metadata as m; v = {d.metadata['Name'].lower(): d.version for d in m.distributions()}; print(*(f'{p} {v[p]}' for p in ('numpy', 'pandas', 'xarray', 'h5py') if p in v))"

      - name: Static checks
        if: inputs.numpy-version == ''
        run: make check

      - name: Tests with coverage
        env:
          UV_NO_SYNC: 1  # the floor environment is not the locked one: uv run must not sync it back
        run: make coverage PYTEST_ARGS="--junitxml=tests-${{ env.LABEL }}.xml --cov-report=xml:coverage-${{ env.LABEL }}.xml"

      - name: Save the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ env.LABEL }}
          path: |
            tests-${{ env.LABEL }}.xml
            coverage-${{ env.LABEL }}.xml

      - name: Upload the coverage to Codecov
        if: github.ref == 'refs/heads/main' && github.repository == 'openweathermap/deker' && inputs.numpy-version == ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage-${{ env.LABEL }}.xml
          token: ${{ secrets.CODECOV_TOKEN }}
