name: checks

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python to run the checks and the tests on
        required: true
        type: string
      siblings:
        description: JSON list of the sibling repositories that tool.uv.sources points to; they are cloned next to the project
        type: string
        default: "[]"
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  checks:
    name: Python ${{ inputs.python-version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from the git tags

      - name: Clone the sibling repositories
        if: inputs.siblings != '[]'
        run: |
          for repo in $(echo '${{ inputs.siblings }}' | jq -r '.[]'); do
            echo "Cloning $repo"
            git clone --quiet --branch "$GITHUB_REF_NAME" "https://github.com/openweathermap/$repo" "../$repo" 2>/dev/null \
              || git clone --quiet "https://github.com/openweathermap/$repo" "../$repo"
            echo "  $(git -C "../$repo" branch --show-current)"
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups --locked

      - name: Static checks
        run: make check

      - name: Tests with coverage
        run: make coverage PYTEST_ARGS="--junitxml=tests-${{ inputs.python-version }}.xml --cov-report=xml:coverage-${{ inputs.python-version }}.xml"

      - name: Save the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ inputs.python-version }}
          path: |
            tests-${{ inputs.python-version }}.xml
            coverage-${{ inputs.python-version }}.xml

      - name: Upload the coverage to Codecov
        if: github.ref == 'refs/heads/main' && github.repository == 'openweathermap/deker'
        uses: codecov/codecov-action@v5
        with:
          files: coverage-${{ inputs.python-version }}.xml
          token: ${{ secrets.CODECOV_TOKEN }}
