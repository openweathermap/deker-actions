name: tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of the Pythons to run the checks and the tests on
        required: true
        type: string
      siblings:
        description: JSON list of the sibling repositories that tool.uv.sources points to; they are cloned next to the project
        type: string
        default: "[]"
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    uses: ./.github/workflows/checks.yml
    with:
      python-version: ${{ matrix.python-version }}
      siblings: ${{ inputs.siblings }}
    secrets: inherit
