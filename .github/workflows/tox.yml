name: tox

on:
  workflow_call:
    inputs:
      min-coverage:
        required: true
        type: number
      package-name:
        type: string
        required: true
      python-versions:
        description: JSON list of Python versions to test on
        type: string
        default: '["3.10", "3.11"]'

jobs:
  py:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    uses: ./.github/workflows/checks.yml
    with:
      python-version: ${{ matrix.python-version }}
      package-name: ${{ inputs.package-name }}
      min-coverage: ${{ inputs.min-coverage }}
