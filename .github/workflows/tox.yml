name: tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of the Pythons to run the checks and the tests on
        required: true
        type: string
      siblings:
        description: JSON list of the sibling repositories that tool.uv.sources points to; they are cloned next to the project
        type: string
        default: "[]"
      numpy-floors:
        description: JSON list of {python, numpy} pairs, the lowest NumPy of every Python; every pair gets a job that runs the tests with that NumPy instead of the locked one
        type: string
        default: "[]"
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    uses: ./.github/workflows/checks.yml
    with:
      python-version: ${{ matrix.python-version }}
      siblings: ${{ inputs.siblings }}
    secrets: inherit

  numpy-floors:
    if: inputs.numpy-floors != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.numpy-floors) }}
    uses: ./.github/workflows/checks.yml
    with:
      python-version: ${{ matrix.python }}
      siblings: ${{ inputs.siblings }}
      numpy-version: ${{ matrix.numpy }}
    secrets: inherit
